<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Najdi sluchátka</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#1c1c1c;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        overflow:hidden;
        font-family:Arial, sans-serif;
    }

    .game-wrapper{
        width:1100px;
        height:800px;
        position:relative;
        overflow:hidden;
        border:4px solid #333;

        display:flex;
        justify-content:center;
        align-items:center;
    }

    #game{
        position:relative;

        width:900px;
        height:768px;
        padding:120px;
        box-sizing:content-box;

        border:4px solid #444;
        overflow:visible;

        background-image:url("stul.jpg");
        background-size:cover;
        background-position:center;
    }

    #headphones{
        position:absolute;
        width:150px;
        cursor:pointer;
        z-index:1;
        user-select:none;
        pointer-events:auto;
    }

    .junk{
        position:absolute;
        cursor:grab;
        user-select:none;
        max-width:none;
        touch-action: none;
    }

    .junk:active{
        cursor:grabbing;
    }

    #modal{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.75);

        display:none;
        justify-content:center;
        align-items:center;

        z-index:9999;
    }

    #modalContent{
        background:white;
        color:black;
        padding:40px;
        border-radius:16px;
        text-align:center;
        min-width:300px;

        box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    #modalContent h2{
        margin-bottom:20px;
    }

    #closeBtn{
        padding:10px 20px;
        border:none;
        border-radius:8px;
        background:#2f7cff;
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    #closeBtn:hover{
        background:#125fe0;
    }

    #inventory {
        position: absolute;
        top: 130px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.75);
        border-radius: 8px;
        padding: 8px 15px;
        display: flex;
        gap: 12px;
        z-index: 5000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        min-height: 66px;
        min-width: 100px;
        justify-content: center;
        align-items: center;
    }

    #inventory img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        display: block;
        cursor: pointer;
        animation: iconPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }

    #inventory img:hover {
        transform: scale(1.1);
    }

    @keyframes iconPop{
        0%  { transform:scale(0) translateY(10px); opacity:0; }
        100%{ transform:scale(1) translateY(0);    opacity:1; }
    }

    #message-overlay{
        position:absolute;
        width:auto;
        inset:0;
        display:none;
        justify-content:center;
        align-items:flex-end;
        padding-bottom:120px;
        z-index:2500;
        cursor:pointer;
    }

    #message-overlay img{
        max-width:75%;
        animation:msgFadeIn 0.3s ease both;
    }

    @keyframes msgFadeIn{
        from{ opacity:0; transform:translateY(20px); }
        to  { opacity:1; transform:translateY(0); }
    }

    #continue-btn{
        position:absolute;
        bottom:130px;
        right:60px;
        padding:12px 28px;
        background:#5de87a;
        color:#1a3d24;
        border:none;
        border-radius:10px;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        display:none;
        z-index:2500;
        animation:pulse 1.8s ease-in-out infinite;
        box-shadow:0 0 0 0 rgba(93,232,122,0.5);
    }

    #continue-btn:hover{
        background:#3fd15f;
    }

    @keyframes pulse{
        0%,100%{ box-shadow:0 0 0 0   rgba(93,232,122,0.6); transform:scale(1);    }
        50%    { box-shadow:0 0 0 12px rgba(93,232,122,0);   transform:scale(1.04); }
    }
</style>
</head>

<body>

<div class="game-wrapper">
    <div id="game">
        <div id="inventory">
            <img src="groovie-icon.png" alt="Groovie" onclick="showItemText('groovie')">
            <img src="autoplay-icon.png" alt="Autoplay" onclick="showItemText('autoplay')">
            <img src="joint-icon.png" alt="Joint" onclick="showItemText('joint')">
        </div>
        <img id="headphones" src="beats.png" alt="Sluchátka">
        <div id="message-overlay">
            <img id="message-img" src="" alt="">
        </div>
        <button id="continue-btn">Pokračovat</button>
    </div>
</div>

<div id="modal" style="display:none!important">
    <div id="modalContent">
        <h2>Výborně, našel jsi sluchátka!</h2>
        <button id="closeBtn">Zavřít</button>
    </div>
</div>

<script>
const game         = document.getElementById("game");
const headphones   = document.getElementById("headphones");
const inventory    = document.getElementById("inventory");
const msgOverlay   = document.getElementById("message-overlay");
const msgImg       = document.getElementById("message-img");
const continueBtn  = document.getElementById("continue-btn");

let bgMusic = null;

function playSound(src){
    const a = new Audio(src);
    a.play().catch(()=>{});
}

function startBackgroundMusic(src){
    if(!bgMusic){
        bgMusic = new Audio(src);
        bgMusic.volume = 0.3;
        bgMusic.loop = true;
        bgMusic.play().catch(()=>{});
    }
}

const collected = { sponka: false, banknote: false, beats: false, blackmoon: false };

const itemTexts = {
    'groovie': "Ashe zatím povolat nepotřebuju.",
    'autoplay': "Tohle si schovám až na velké finále.",
    'joint': "Zhulím se až později, až všechno vyřídím.",
    '500': "Bonus za úspěšné hospodaření Lesů České republiky. Čuráci.",
    'deska': "Už se těším, jak s touhle deskou Dávičovi natrhnu prdel.",
    'sponka': "Hm, ta ikonka mi něco připomíná.",
    'sluchatka': "Čínská kopie sluchátek od Dr. Dre. Slušně izolují od okolí.",
    'maui': "Moje huňatá kulička. Když je napapaná. Jinak je to krvelačná bestie."
};

function showItemText(key) {
    if (itemTexts[key]) {
        alert(itemTexts[key]);
    }
}

function addIcon(src, key){
    inventory.style.display = "flex";
    const ico = document.createElement("img");
    ico.src = src;
    ico.alt = "";
    ico.onclick = () => showItemText(key);
    inventory.appendChild(ico);
    playSound("icon-show.wav");
}

function showMessage(imgSrc, onClose){
    msgImg.src = imgSrc;
    msgOverlay.style.display = "flex";

    function dismiss(){
        msgOverlay.style.display = "none";
        msgOverlay.removeEventListener("click", dismiss);
        if(onClose) onClose();
    }
    msgOverlay.addEventListener("click", dismiss);
}

function checkCompletion(){
    if(collected.sponka && collected.banknote && collected.beats && collected.blackmoon){
        showMessage("koment.png", ()=>{
            showMessage("maui-text.png", ()=>{
                playSound("meow.mp3");
                addIcon("maui-icon.png", "maui");
                continueBtn.style.display = "block";
                if(bgMusic){
                    bgMusic.pause();
                }
            });
        });
    }
}

headphones.addEventListener("load", placeHeadphones);
if(headphones.complete) placeHeadphones();

function placeHeadphones(){
    const gameW = game.clientWidth;
    const gameH = game.clientHeight;
    const hw = headphones.offsetWidth  || 120;
    const hh = headphones.offsetHeight || 60;
    const margin = 20;
    const x = margin + Math.random() * (gameW - hw - margin * 2);
    const y = margin + Math.random() * (gameH - hh - margin * 2);
    headphones.style.left = x + "px";
    headphones.style.top  = y + "px";
}

headphones.addEventListener("click", (e) => {
    if(collected.beats) return;
    e.stopPropagation();
    collected.beats = true;
    playSound("grab.wav");
    headphones.style.display = "none";
    showMessage("sluchatka-text.png", ()=>{
        addIcon("sluchatka-icon.png", "sluchatka");
        checkCompletion();
    });
});

const junkImages = [
    "blok.png", "mobil.png", "mince.png", "keanu.jpg", "necro.png", "voynich.jpg",
    "evil.jpg", "doom.jpg", "map.jpg", "znak.png", "tacek.png", "postava.jpg",
    "hypnoza.jpg", "bruce.jpg", "bernau.png", "sifra.png", "blackmoon.png", "500.png", "sponka.png"
];

const specialItems = {
    "sponka.png": (img) => {
        if(collected.sponka) return;
        collected.sponka = true;
        playSound("grab.wav");
        img.style.display = "none";
        showMessage("sponka-text.png", ()=>{
            addIcon("sponka-icon.png", "sponka");
            checkCompletion();
        });
    },
    "500.png": (img) => {
        if(collected.banknote) return;
        collected.banknote = true;
        playSound("grab.wav");
        img.style.display = "none";
        showMessage("500-text.png", ()=>{
            addIcon("500-icon.png", "500");
            checkCompletion();
        });
    },
    "blackmoon.png": (img) => {
        if(collected.blackmoon) return;
        collected.blackmoon = true;
        playSound("found-scratch.wav");
        img.style.display = "none";
        showMessage("deska-text.png", ()=>{
            addIcon("deska-icon.png", "deska");
            checkCompletion();
        });
    }
};

junkImages.forEach((src) => {
    const img = document.createElement("img");
    img.src = src;
    img.classList.add("junk");
    img.dataset.src = src;
    img.style.left = Math.random() * 760 + "px";
    img.style.top  = Math.random() * 460 + "px";
    img.style.zIndex = Math.floor(Math.random() * 100) + 2;
    const rot = Math.random() * 360;
    img.style.transform = `rotate(${rot}deg)`;
    game.appendChild(img);

    if(specialItems[src]){
        img.style.cursor = "pointer";
        img.addEventListener("click", (e) => {
            e.stopPropagation();
            specialItems[src](img);
        });
    } else {
        makeDraggable(img);
    }
});

function makeDraggable(element){
    let dragging = false;

    function startDrag(e) {
        dragging = !dragging;
        if(dragging){
            element.style.zIndex = parseInt(element.style.zIndex || 0) + 1000;
        }
        e.stopPropagation();
    }

    function moveDrag(e) {
        if(!dragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const gameRect = game.getBoundingClientRect();
        const elemWidth  = element.offsetWidth;
        const elemHeight = element.offsetHeight;

        let x = clientX - gameRect.left - elemWidth  / 2;
        let y = clientY - gameRect.top  - elemHeight / 2;

        const visibleMargin = 40;
        const dragPadding   = 120;
        const minX = -elemWidth  + visibleMargin;
        const minY = -elemHeight + visibleMargin;
        const maxX = game.clientWidth  + dragPadding - elemWidth  + visibleMargin;
        const maxY = game.clientHeight + dragPadding - elemHeight + visibleMargin;

        element.style.left = Math.max(minX, Math.min(x, maxX)) + "px";
        element.style.top  = Math.max(minY, Math.min(y, maxY)) + "px";
    }

    element.addEventListener("click", startDrag);
    element.addEventListener("touchstart", (e) => {
        startDrag(e);
        e.preventDefault();
    }, {passive: false});

    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("touchmove", moveDrag, {passive: false});

    document.addEventListener("click", (e) => { if(e.target !== element) dragging = false; });
    document.addEventListener("touchstart", (e) => { if(e.target !== element) dragging = false; });
}

showMessage("uvod-text.png", () => {
    startBackgroundMusic("searching.mp3");
});
</script>

</body>
</html>
