<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Najdi mnicha</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght=700&display=swap');

    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #game {
        position: relative;
        width: 900px;
        height: 768px;
        overflow: hidden;
        background: #000;
        user-select: none;
    }

    #background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #monk {
        position: absolute;
        width: 50px;
        bottom: 305px;
        z-index: 2;
        transition: transform 0.6s ease;
        transform: translateY(50px);
        pointer-events: none;
        visibility: hidden;
    }

    .bush {
        position: absolute;
        bottom: 180px;
        width: 150px;
		cursor: pointer;
        z-index: 3;
        transition: transform 0.2s;
    }

    .bush:hover {
        transform: scale(1.03);
    }

    #bush1 { left: 80px; }
    #bush2 { left: 385px; }
    #bush3 { left: 670px; }

    #fade {
        position: absolute;
        inset: 0;
        background: black;
        opacity: 0;
        z-index: 20;
        pointer-events: none;
        transition: opacity 1.2s;
    }

    #speech {
        position: absolute;
        z-index: 10;
        padding: 16px 24px;
        background: white;
        border: 4px solid black;
        border-radius: 30px;
        font-size: 28px;
        font-weight: bold;
        display: none;
        transform: translate(-50%, -50%);
        animation: pop 0.3s ease;
    }

    #speech::after {
        content: "";
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 22px 18px 0 18px;
        border-style: solid;
        border-color: white transparent transparent transparent;
    }

    #speech::before {
        content: "";
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 28px 22px 0 22px;
        border-style: solid;
        border-color: black transparent transparent transparent;
    }

    @keyframes pop {
        from {
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
        }
        to {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    }

    #score {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 30;
        color: white;
        font-size: 32px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
    }

    #intro {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none;
    }

    #intro img {
        width: auto;
        max-width: 80%;
        pointer-events: auto;
        cursor: pointer;
    }

    /* --- STYLY PRO INVENTÁŘ --- */
    #inventory {
        position: absolute;
        top: 15px; left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.3);
        border-radius: 8px;
        padding: 8px 15px;
        display: flex;
        gap: 12px;
        z-index: 50;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .inv-item {
        width: 48px; height: 48px;
        object-fit: contain;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .inv-item:hover {
        transform: scale(1.1);
    }

    /* --- STYLY PRO NOVÉ PRVKY --- */
    .comic-asset {
        position: absolute;
        display: block;
        user-select: none;
        cursor: pointer;
    }

    #btn-pokracovat {
        position: absolute;
        right: 40px; bottom: 40px;
        display: none;
        z-index: 300;
        padding: 15px 40px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #111;
        background: #00cc44;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,204,68,0.4);
        animation: pulse-continue 1.4s infinite ease-in-out;
    }

    @keyframes pulse-continue {
        0%   { transform: scale(1);    box-shadow: 0 5px 15px rgba(0,204,68,0.4); }
        50%  { transform: scale(1.06); box-shadow: 0 5px 25px rgba(0,204,68,0.8); }
        100% { transform: scale(1);    box-shadow: 0 5px 15px rgba(0,204,68,0.4); }
    }
</style>
</head>
<body>

<div id="game">

    <img id="background" src="Zahrada.jpg">

    <img id="monk" src="Mnich.png">

    <img class="bush" id="bush1" src="ker1.png">
    <img class="bush" id="bush2" src="ker2.png">
    <img class="bush" id="bush3" src="ker3.png">

    <div id="fade"></div>

    <div id="speech"></div>

    <div id="score">Body: 0 / 3</div>

    <div id="intro">
        <img src="zadani_zahrada.png" alt="Zadání">
    </div>

    <!-- INVENTÁŘ -->
    <div id="inventory">
      <img id="inv-autoplay" class="inv-item" src="autoplay-icon.png" alt="Autoplay" onclick="showItemText('autoplay')">
      <img id="inv-joint" class="inv-item" src="joint-icon.png" alt="Joint" onclick="clickJointItem()">
      <img id="inv-deska" class="inv-item" src="deska-icon.png" alt="Deska" onclick="showItemText('deska')">
      <img id="inv-sluchatka" class="inv-item" src="sluchatka-icon.png" alt="Sluchátka" onclick="showItemText('sluchatka')">
      <img id="inv-flipper" class="inv-item" src="flipper-icon.png" alt="Flipper" onclick="showItemText('flipper')">
    </div>

    <!-- DYNAMICKY OBJEVOVANÉ KOMIKSOVÉ PRVKY -->
    <img id="guru-big" class="comic-asset" src="Guru-big.png" alt="Guru" style="left: 44px; top: 355px; z-index: 40; display: none;">

    <img id="zahrada-text1" class="comic-asset" src="zahrada-text1.png" style="left: 175px; top: 353px; z-index: 45; display: none;">
    <img id="zahrada-text2" class="comic-asset" src="zahrada-text2.png" style="left: 537px; top: 236px; z-index: 45; display: none;">
    <img id="zahrada-text3" class="comic-asset" src="zahrada-text3.png" style="left: 115px; top: 189px; z-index: 45; display: none;">
    <img id="zahrada-text4" class="comic-asset" src="zahrada-text4.png" style="left: 62px; top: 208px; z-index: 45; display: none;">
    <img id="zahrada-text5" class="comic-asset" src="zahrada-text5.png" style="left: 460px; top: 263px; z-index: 45; display: none;">
    <img id="zahrada-text6" class="comic-asset" src="zahrada-text6.png" style="left: 60px; top: 194px; z-index: 45; display: none;">
    <img id="zahrada-text7" class="comic-asset" src="zahrada-text7.png" style="left: 493px; top: 300px; z-index: 45; display: none;">
    <img id="zahrada-text8" class="comic-asset" src="zahrada-text8.png" style="left: 85px; top: 275px; z-index: 45; display: none;">
    <img id="zahrada-text9" class="comic-asset" src="zahrada-text9.png" style="left: 518px; top: 282px; z-index: 45; display: none;">
    <img id="zahrada-text1-final" class="comic-asset" src="zahrada-text10.png" style="left: 96px; top: 292px; z-index: 45; display: none;">

    <button id="btn-pokracovat" onclick="window.location.href='vyhlidka2-final2.html'">Pokračovat</button>

</div>

<div id="modal-item-text" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:600; display:none; justify-content:center; align-items:center;">
  <div style="background:#2a2a2a; border:3px solid #00cc44; border-radius:10px; padding:25px; text-align:center; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.8);">
    <p id="item-description-text" style="font-size:18px; margin-bottom:20px; letter-spacing:1px; line-height:1.4; color:#fff;"></p>
    <button onclick="closeItemModal()" style="background:#00cc44; color:#111; border:none; padding:8px 20px; font-family:'Share Tech Mono', monospace; font-size:14px; font-weight:bold; cursor:pointer; border-radius:4px; text-transform:uppercase;">Zavřít</button>
  </div>
</div>

<script>

const monk = document.getElementById("monk");
const fade = document.getElementById("fade");
const speech = document.getElementById("speech");
const scoreEl = document.getElementById("score");
const btnPokracovat = document.getElementById("btn-pokracovat");

const bushes = [
    document.getElementById("bush1"),
    document.getElementById("bush2"),
    document.getElementById("bush3")
];

const monkPositions = [
    { x: 110, sound: "Steps_left.mp3" },
    { x: 425, sound: "Steps_center.mp3" },
    { x: 690, sound: "Steps_right.mp3" }
];

const bgAudio = new Audio("Birds.mp3");
bgAudio.loop = true;
bgAudio.volume = 0.6;

let currentIndex = 0;
let score = 0;
let inputEnabled = false;
let finalPhaseActive = false;

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function startRound() {
    inputEnabled = false;
    monk.style.transform = "translateY(70px)";
    speech.style.display = "none";
    fade.style.opacity = 1;
    await wait(1400);

    monk.style.visibility = "visible";
    currentIndex = Math.floor(Math.random() * 3);
    monk.style.left = monkPositions[currentIndex].x + "px";

    const stepAudio = new Audio(monkPositions[currentIndex].sound);
    stepAudio.volume = 0.7;
	stepAudio.play();
    await wait(1400);

    fade.style.opacity = 0;
    await wait(1200);
    inputEnabled = true;
}

function showSpeech(text) {
    speech.innerText = text;
    const monkRect = monk.getBoundingClientRect();
    const gameRect = game.getBoundingClientRect();
    speech.style.left = (monkRect.left - gameRect.left + 90) + "px";
    speech.style.top = (monkRect.top - gameRect.top - 20) + "px";
    speech.style.display = "block";
}

async function revealMonk(correct) {
    inputEnabled = false;
    if (currentIndex === 0) {
        monk.style.transform = "translateX(80px) translateY(-70px) rotate(20deg)";
    } else if (currentIndex === 1) {
        monk.style.transform = "translateY(5px)";
    } else {
        monk.style.transform = "translateX(-30px) translateY(-60px) rotate(-20deg)";
    }
    await wait(700);

    const roundNumber = score + 1;

    if(correct) {
        showSpeech("Správně!");
        const correctAudio = new Audio(`spravne${roundNumber}.mp3`);
        correctAudio.volume = 0.7;
        correctAudio.play().catch(e => console.log(e));
        score++;
    } else {
        showSpeech("Vedle!");
        const wrongAudio = new Audio(`vedle${roundNumber}.mp3`);
        wrongAudio.volume = 0.7;
        wrongAudio.play().catch(e => console.log(e));
        score = 0;
    }
    scoreEl.innerText = `Body: ${score} / 3`;

    if(score >= 3) {
        await wait(2800);
        initGuruTransformation();
        return;
    }

    await wait(2200);
    startRound();
}

bushes.forEach((bush, index) => {
    bush.addEventListener("click", () => {
        if(!inputEnabled) return;
        revealMonk(index === currentIndex);
    });
});

const intro = document.getElementById("intro");
intro.addEventListener("click", () => {
    intro.style.display = "none";
    startRound();
}, { once: true });

window.addEventListener("click", () => {
    if(bgAudio.paused) {
        bgAudio.play();
    }
}, { once: true });

/* --- LOGIKA PODLE DESIGN DOKUMENTU --- */

function initGuruTransformation() {
    inputEnabled = false;
    monk.style.display = "none";
    speech.style.display = "none";
    scoreEl.style.display = "none";

    const guru = document.getElementById("guru-big");
    guru.style.display = "block";
	const svistAudio = new Audio("svist.mp3");
	svistAudio.volume = 0.8;
	svistAudio.play();

    guru.addEventListener("click", () => {
        guru.style.display = "none";
        bushes.forEach(bush => bush.style.display = "none");
        document.getElementById("background").src = "Zahrada2.jpg";
        showZahradaTextSequence();
    }, { once: true });
}

function showZahradaTextSequence() {
    const sequenceIds = [
        "zahrada-text1", "zahrada-text2", "zahrada-text3", "zahrada-text4", "zahrada-text5",
        "zahrada-text6", "zahrada-text7", "zahrada-text8", "zahrada-text9", "zahrada-text1-final"
    ];
    let currentStep = 0;

    function showNext() {
        if (currentStep < sequenceIds.length) {
            const currentEl = document.getElementById(sequenceIds[currentStep]);
            currentEl.style.display = "block";
            currentEl.addEventListener("click", () => {
                currentEl.style.display = "none";
                currentStep++;
                showNext();
            }, { once: true });
        } else {
            finalPhaseActive = true;
        }
    }
    showNext();
}

function clickJointItem() {
    if (!finalPhaseActive) {
        showItemText('joint');
        return;
    }
    const jointIcon = document.getElementById("inv-joint");
    if (jointIcon) {
        jointIcon.remove();
    }
    const smokeAudio = new Audio("smoke.mp3");
    smokeAudio.volume = 0.6;
    smokeAudio.play().catch(e => console.log(e));
    smokeAudio.addEventListener("ended", () => {
        btnPokracovat.style.display = "block";
    });
}

/* --- INVENTÁŘ DATA --- */
const itemTexts = {
  'autoplay': "Tohle si schovám až na velké finále.",
  'deska': "Už se těším, jak s touhle deskou Dávičovi natrhnu prdel.",
  'joint': "Zhulím se až později, až všechno vyřídím.",
  'sluchatka': "Čínská kopie sluchátek od Dr. Dre. Slušně izolují od okolí.",
  'flipper': "Malá krabička umožňující ovládat různá zařízení z dálky."
};

function showItemText(key) {
  document.getElementById('item-description-text').innerText = itemTexts[key] || '';
  document.getElementById('modal-item-text').style.display = 'flex';
}

function closeItemModal() {
  document.getElementById('modal-item-text').style.display = 'none';
}
</script>

</body>
</html>
